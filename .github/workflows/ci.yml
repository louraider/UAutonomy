name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.1"
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Rust-ядро (fmt, clippy, тести)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Базовий пакет із content/
        run: python3 tools/build_base_pack.py
        working-directory: .
      - name: Сайт - SEO-файли збігаються з джерелом
        run: python3 tools/site/build_seo.py --check
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: Хаб збирається в release
        run: cargo build --release -p uautonomy-hub
      - uses: actions/upload-artifact@v4
        with:
          name: uautonomy-hub-linux-x64
          path: core/target/release/uautonomy-hub
          retention-days: 14

  flutter-analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib integration_test test
      - run: flutter analyze
      - run: flutter test test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: [core, flutter-analyze]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Базовий пакет із content/
        run: python3 tools/build_base_pack.py
        working-directory: .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Постійний ключ із секретів репозиторію (див. docs/signing.md). Без
      # секретів (наприклад, PR із форку) збірка підписується debug-ключем
      # з попередженням; на main ключ обов'язковий.
      - name: Ключ підпису APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Секрети ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD не задані: APK буде з debug-ключем"
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::На main реліз без постійного ключа не збираємо"; exit 1
            fi
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "UAUTONOMY_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "UAUTONOMY_REQUIRE_RELEASE_KEY=1" >> "$GITHUB_ENV"
      # Окремий APK під кожну архітектуру замість одного універсального:
      # універсальний ніс бібліотеки трьох процесорів одразу (269 МБ).
      # Основний — arm64-v8a, він же лежить у релізі під сталою назвою
      # avtonomiia.apk. «Обмін» роздає той APK, що встановлено на телефоні.
      # Символи Dart окремо (--split-debug-info), щоб розшифрувати падіння.
      # Номер запуску CI = номер збірки: з нього Android бере versionCode
      # (плюс 1000 × ABI), а застосунок порівнює його з version.json релізу,
      # щоб сказати людині про нову версію (lib/update/update_check.dart).
      # Збірки для Google Play і Microsoft Store мають задавати
      # UAUTONOMY_DIST=play / msstore: там оновлює магазин, і перевірки немає.
      # UAUTONOMY_STATS_KEY вмикає анонімну статистику за згодою людини
      # (lib/stats/stats.dart). Ключ Aptabase не секретний і однаково лежить
      # у застосунку, тому стоїть тут; змінна репозиторію має перевагу.
      # Без ключа застосунок не питає згоди і нічого не надсилає.
      # Maven Central часом відповідає 429 (забагато запитів): повтор.
      - name: flutter build apk
        env:
          UAUTONOMY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          for i in 1 2 3; do
            flutter build apk --release --split-per-abi --split-debug-info=build/symbols --build-number=${{ github.run_number }} --dart-define=UAUTONOMY_BUILD=${{ github.run_number }} --dart-define=UAUTONOMY_DIST=site --dart-define=UAUTONOMY_STATS_KEY=${{ vars.UAUTONOMY_STATS_KEY || 'A-EU-3389314094' }} --dart-define=UAUTONOMY_STATS_HOST=${{ vars.UAUTONOMY_STATS_HOST }} && exit 0
            echo "::warning::спроба $i не вдалася, повтор"; sleep 60
          done
          exit 1
      - name: Сертифікат підпису і розмір APK
        working-directory: app/build/app/outputs/flutter-apk
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            "$APKSIGNER" verify --print-certs "app-$abi-release.apk" | tee "cert-$abi.txt"
            if grep -q "CN=Android Debug" "cert-$abi.txt"; then echo "::warning::APK $abi підписано debug-ключем"; fi
            cp "app-$abi-release.apk" "dist/avtonomiia-$abi.apk"
          done
          ls -l dist
          # Сторож розміру: LiteRT-LM чи Vulkan на Android повернулися б
          # непомітно (налаштування в app/pubspec.yaml, hooks.user_defines).
          SIZE=$(stat -c %s dist/avtonomiia-arm64-v8a.apk)
          echo "arm64-v8a: $((SIZE / 1048576)) МБ"
          if [ "$SIZE" -gt $((60 * 1048576)) ]; then
            echo "::error::APK arm64-v8a важить понад 60 МБ"; unzip -lv dist/avtonomiia-arm64-v8a.apk | sort -k3 -n -r | head -20; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: uautonomy-android-apk
          path: app/build/app/outputs/flutter-apk/dist/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: uautonomy-android-symbols
          path: app/build/symbols
          retention-days: 90

  android-e2e:
    name: Android-емулятор (наскрізний тест)
    runs-on: ubuntu-latest
    needs: [core, flutter-analyze]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Базовий пакет із content/
        run: python3 tools/build_base_pack.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
          key: e2e
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      # Збірка до запуску емулятора: залежності Gradle з повторами, бо
      # збій мережі під час тесту інакше валить усе.
      - name: Попередня збірка (Gradle з повторами)
        working-directory: app
        run: |
          for i in 1 2 3; do
            flutter build apk --debug --target-platform android-x64 -t integration_test/app_test.dart && exit 0
            echo "::warning::спроба $i не вдалася, повтор"; sleep 30
          done
          exit 1
      - name: KVM для емулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Тест офлайн-функцій і, через мережу, завантаження карти Києва
      # з офіційного каталогу (випуск packs).
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: app
          script: flutter test integration_test/app_test.dart -d emulator-5554 --dart-define=NETWORK_TESTS=true

  windows:
    name: Windows
    runs-on: windows-latest
    needs: [core, flutter-analyze]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Базовий пакет із content/
        run: python tools/build_base_pack.py
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --build-number=${{ github.run_number }} --dart-define=UAUTONOMY_BUILD=${{ github.run_number }} --dart-define=UAUTONOMY_DIST=site --dart-define=UAUTONOMY_STATS_KEY=${{ vars.UAUTONOMY_STATS_KEY || 'A-EU-3389314094' }} --dart-define=UAUTONOMY_STATS_HOST=${{ vars.UAUTONOMY_STATS_HOST }}
      - name: Модулі llama.cpp у збірці (чи є Vulkan)
        shell: pwsh
        run: Get-ChildItem build/windows/x64/runner/Release -Recurse -Include *.dll | Select-Object Name, Length | Format-Table -AutoSize
      - name: Бібліотеки Visual C++ поруч із exe
        shell: pwsh
        run: |
          foreach ($f in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll') {
            if (-not (Test-Path "build/windows/x64/runner/Release/$f")) { throw "немає $f у збірці" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: uautonomy-windows
          path: app/build/windows/x64/runner/Release/
          retention-days: 14
      # Інсталятор для звичайних людей: один файл, без прав адміністратора,
      # ярлики й видалення через «Програми та компоненти».
      - name: Інсталятор (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          $base = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          $ver = "$base.${{ github.run_number }}"
          $src = (Resolve-Path build/windows/x64/runner/Release).Path
          & $iscc /Qp "/DSourceDir=$src" "/DAppVersion=$ver" "/DOutputDir=$PWD\build\installer" windows/installer/avtonomiia.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC: код $LASTEXITCODE" }
          Get-Item build/installer/avtonomiia-windows-setup.exe | Select-Object Name, Length
      # Тихе встановлення, запуск і видалення, як у людини на чистому ПК.
      - name: Інсталятор ставить, запускає й видаляє застосунок
        shell: pwsh
        run: |
          $setup = (Resolve-Path build/installer/avtonomiia-windows-setup.exe).Path
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "встановлення: код $($p.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\Avtonomiia"
          foreach ($f in 'uautonomy.exe', 'flutter_windows.dll', 'vcruntime140.dll', 'data\app.so', 'unins000.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "немає $dir\$f" }
          }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter '*.lnk' | Where-Object Name -like 'Автономія*'
          if (-not $lnk) { throw 'немає ярлика в меню «Пуск»' }
          if (-not (Test-Path ([Environment]::GetFolderPath('Desktop') + '\Автономія.lnk'))) { throw 'немає ярлика на робочому столі' }
          $reg = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty | Where-Object DisplayName -eq 'Автономія'
          if (-not $reg) { throw 'немає запису в «Програмах та компонентах»' }
          "Встановлено: $($reg.DisplayName) $($reg.DisplayVersion)"
          $app = Start-Process "$dir\uautonomy.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "застосунок завершився одразу, код $($app.ExitCode)" }
          "Застосунок працює 20 с, пам'ять $([math]::Round($app.WorkingSet64 / 1MB)) МБ"
          Stop-Process -Id $app.Id -Force
          Start-Sleep -Seconds 2
          $u = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "видалення: код $($u.ExitCode)" }
          # Деінсталятор прибирає себе з невеликою затримкою.
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\uautonomy.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\uautonomy.exe") { throw 'після видалення exe лишився' }
          if (-not (Test-Path "$env:APPDATA\org.uautonomy")) {
            Get-ChildItem $env:APPDATA | Select-Object Name | Format-Table | Out-String | Write-Host
            throw "немає даних у $env:APPDATA\org.uautonomy: або тихе видалення їх стерло, або застосунок пише деінде (тоді виправте шлях у avtonomiia.iss)"
          }
          'Видалено, дані користувача лишилися'
      - uses: actions/upload-artifact@v4
        with:
          name: uautonomy-windows-setup
          path: app/build/installer/avtonomiia-windows-setup.exe
          retention-days: 14

  windows-e2e:
    name: Windows (наскрізний тест)
    runs-on: windows-latest
    needs: [core, flutter-analyze]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Базовий пакет із content/
        run: python tools/build_base_pack.py
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
          key: e2e
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Той самий тест, що й на Android-емуляторі: довідка, вкладки, обмін,
      # а через мережу ще й підписаний каталог і карта Києва.
      - run: flutter test integration_test/app_test.dart -d windows --dart-define=NETWORK_TESTS=true

  # iOS: збірка без підпису (підпис і TestFlight потребують облікового
  # запису Apple Developer, див. docs/ios.md) і той самий наскрізний тест
  # на симуляторі iPhone, плюс запуск llama.cpp на крихітній моделі.
  ios:
    name: iOS (збірка без підпису і симулятор)
    runs-on: macos-15
    needs: [core, flutter-analyze]
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Базовий пакет із content/
        run: python3 tools/build_base_pack.py
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
          key: ios
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Xcode
        run: xcodebuild -version && xcrun simctl list runtimes
      # Entitlement increased-memory-limit вимагає профілю з командою Apple
      # (Xcode: «has entitlements that require signing with a development
      # certificate»). Збірка без підпису однаково не несе entitlements,
      # тож у CI прибираємо лише цей рядок; у підписаній збірці він лишається.
      - name: Без entitlements (немає підпису)
        run: sed -i '' '/CODE_SIGN_ENTITLEMENTS = Runner\/Runner.entitlements;/d' ios/Runner.xcodeproj/project.pbxproj
      # Release-збірка для справжнього iPhone (arm64), без підпису: перевіряє,
      # що Rust-ядро, llama.cpp (Metal, через SwiftPM) і плагіни лінкуються.
      # Flutter ховає помилки Xcode за загальною порадою про підпис, тож
      # пишемо повний журнал і показуємо з нього рядки з помилками.
      - name: flutter build ios --release --no-codesign
        run: |
          set +e
          flutter build ios --release --no-codesign -v > "$RUNNER_TEMP/ios-build.log" 2>&1
          code=$?
          grep -E "error(\[E[0-9]+\])?:|\*\* BUILD|requires a development team" "$RUNNER_TEMP/ios-build.log" | sort -u | head -80
          if [ $code -ne 0 ]; then
            # Помилка cargo: без рядків про завантаження й компіляцію крейтів.
            grep "SEVERE:" "$RUNNER_TEMP/ios-build.log" | grep -vE "Downloaded|Compiling|Downloading|Updating|Blocking" | head -150
            grep -n -B3 -A25 "^\s*error" "$RUNNER_TEMP/ios-build.log" | head -200
          fi
          exit $code
      - name: Розмір і вміст збірки
        working-directory: app/build/ios/iphoneos
        run: |
          du -sh Runner.app
          du -sh Runner.app/Frameworks/* | sort -h | tail -15
          # Маніфест приватності і ключі, без яких App Store відхилить збірку.
          test -f Runner.app/PrivacyInfo.xcprivacy
          plutil -p Runner.app/Info.plist | grep -E "CFBundleDisplayName|MinimumOSVersion|ITSAppUsesNonExemptEncryption"
          mkdir -p Payload && cp -R Runner.app Payload/
          zip -q -r -y avtonomiia-ios-unsigned.ipa Payload
          ls -l avtonomiia-ios-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: uautonomy-ios-build-log
          path: ${{ runner.temp }}/ios-build.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: uautonomy-ios-unsigned
          path: app/build/ios/iphoneos/avtonomiia-ios-unsigned.ipa
          retention-days: 14
      - name: Симулятор iPhone
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in d if "iOS" in r), key=lambda r: [int(x) for x in r.rsplit("iOS-", 1)[1].split("-")])
          for r in reversed(ios):
              for dev in d[r]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit(0)
          sys.exit("немає симулятора iPhone")')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      # Офлайн-довідка, вкладки, обмін, а через мережу ще й підписаний
      # каталог, карта Києва і llama.cpp на крихітній моделі.
      - run: >-
          flutter test integration_test/app_test.dart -d "$SIM_UDID"
          --dart-define=NETWORK_TESTS=true --dart-define=AI_TESTS=true

  # Після кожного злиття в main: свіжі APK і Windows-збірка в релізі `app`.
  # Назви файлів сталі, тож посилання з сайту uautonomy.app не змінюються:
  # https://github.com/louraider/UAutonomy/releases/download/app/avtonomiia.apk
  release:
    name: Реліз збірок (app)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, windows, android-e2e, windows-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-app
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: uautonomy-android-apk
          path: dist/android
      - uses: actions/download-artifact@v4
        with:
          name: uautonomy-windows
          path: dist/Avtonomiia
      - uses: actions/download-artifact@v4
        with:
          name: uautonomy-windows-setup
          path: dist
      - name: Файли релізу
        working-directory: dist
        run: |
          # Сталий avtonomiia.apk (посилання з сайту й старі посилання) —
          # це arm64-v8a, він підходить майже всім телефонам.
          cp android/avtonomiia-arm64-v8a.apk avtonomiia.apk
          mv android/avtonomiia-armeabi-v7a.apk android/avtonomiia-x86_64.apk .
          zip -r -q -9 avtonomiia-windows-x64.zip Avtonomiia
          # Що застосунок вважає останньою версією (див. lib/update/update_check.dart).
          printf '{"build": %s, "commit": "%s", "date": "%s"}\n' "$GITHUB_RUN_NUMBER" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%d)" > version.json
          cat version.json
          sha256sum avtonomiia.apk avtonomiia-armeabi-v7a.apk avtonomiia-x86_64.apk avtonomiia-windows-setup.exe avtonomiia-windows-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Оновити реліз app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f app "$GITHUB_SHA"
          git push -f origin refs/tags/app
          NOTES="Тестова збірка з main, коміт ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d)).

          - Android: avtonomiia.apk — для більшості телефонів (arm64-v8a)
          - Android, старі 32-бітні телефони: avtonomiia-armeabi-v7a.apk (без ШІ-помічника)
          - Android, Chromebook та емулятори: avtonomiia-x86_64.apk
            (усі APK підписано постійним ключем, SHA-256 сертифіката в docs/signing.md)
          - Windows 10 і 11: avtonomiia-windows-setup.exe — інсталятор, без прав адміністратора
          - Windows без встановлення: avtonomiia-windows-x64.zip (розпакуйте й запустіть Avtonomiia/uautonomy.exe)
          - Контрольні суми: SHA256SUMS.txt

          Медичні картки складено за Наказом МОЗ №441, але лікар їх ще не перевірив."
          FILES="dist/avtonomiia.apk dist/avtonomiia-armeabi-v7a.apk dist/avtonomiia-x86_64.apk dist/avtonomiia-windows-setup.exe dist/avtonomiia-windows-x64.zip dist/SHA256SUMS.txt dist/version.json"
          if gh release view app >/dev/null 2>&1; then
            gh release upload app $FILES --clobber
            gh release edit app --notes "$NOTES" --prerelease
          else
            gh release create app $FILES --title "Автономія: остання збірка" --notes "$NOTES" --prerelease
          fi
