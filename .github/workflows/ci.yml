name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.1"
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Rust-ядро (fmt, clippy, тести)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Базовий пакет із content/
        run: python3 tools/build_base_pack.py
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: Хаб збирається в release
        run: cargo build --release -p uautonomy-hub
      - uses: actions/upload-artifact@v4
        with:
          name: uautonomy-hub-linux-x64
          path: core/target/release/uautonomy-hub
          retention-days: 14

  flutter-analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib integration_test test
      - run: flutter analyze
      - run: flutter test test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: [core, flutter-analyze]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Базовий пакет із content/
        run: python3 tools/build_base_pack.py
        working-directory: .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Постійний ключ із секретів репозиторію (див. docs/signing.md). Без
      # секретів (наприклад, PR із форку) збірка підписується debug-ключем
      # з попередженням; на main ключ обов'язковий.
      - name: Ключ підпису APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Секрети ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD не задані: APK буде з debug-ключем"
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::На main реліз без постійного ключа не збираємо"; exit 1
            fi
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "UAUTONOMY_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "UAUTONOMY_REQUIRE_RELEASE_KEY=1" >> "$GITHUB_ENV"
      # Один універсальний APK для всіх процесорів: його «Обмін» роздає
      # іншим телефонам, і він має встановитися на будь-якому.
      - run: flutter build apk --release
        env:
          UAUTONOMY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: Сертифікат підпису APK
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee cert.txt
          if grep -q "CN=Android Debug" cert.txt; then echo "::warning::APK підписано debug-ключем"; fi
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/avtonomiia.apk
      - uses: actions/upload-artifact@v4
        with:
          name: uautonomy-android-apk
          path: app/build/app/outputs/flutter-apk/avtonomiia.apk
          retention-days: 14

  android-e2e:
    name: Android-емулятор (наскрізний тест)
    runs-on: ubuntu-latest
    needs: [core, flutter-analyze]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Базовий пакет із content/
        run: python3 tools/build_base_pack.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
          key: e2e
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      # Збірка до запуску емулятора: залежності Gradle з повторами, бо
      # збій мережі під час тесту інакше валить усе.
      - name: Попередня збірка (Gradle з повторами)
        working-directory: app
        run: |
          for i in 1 2 3; do
            flutter build apk --debug --target-platform android-x64 -t integration_test/app_test.dart && exit 0
            echo "::warning::спроба $i не вдалася, повтор"; sleep 30
          done
          exit 1
      - name: KVM для емулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Тест офлайн-функцій і, через мережу, завантаження карти Києва
      # з офіційного каталогу (випуск packs).
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: app
          script: flutter test integration_test/app_test.dart -d emulator-5554 --dart-define=NETWORK_TESTS=true

  windows:
    name: Windows
    runs-on: windows-latest
    needs: [core, flutter-analyze]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Базовий пакет із content/
        run: python tools/build_base_pack.py
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: uautonomy-windows
          path: app/build/windows/x64/runner/Release/
          retention-days: 14

  windows-e2e:
    name: Windows (наскрізний тест)
    runs-on: windows-latest
    needs: [core, flutter-analyze]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Базовий пакет із content/
        run: python tools/build_base_pack.py
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
          key: e2e
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Той самий тест, що й на Android-емуляторі: довідка, вкладки, обмін,
      # а через мережу ще й підписаний каталог і карта Києва.
      - run: flutter test integration_test/app_test.dart -d windows --dart-define=NETWORK_TESTS=true
