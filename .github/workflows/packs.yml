name: Пакети (карти, моделі) → GitHub Releases

# Публікація: Actions → «Пакети» → Run workflow. Файли лягають у випуск
# з тегом `packs`, звідки їх бере застосунок (каталог за замовчуванням).
# На PR, що змінює інструменти карт, збирається лише Київ без публікації.
# Щопонеділка за розкладом перевіряються нові версії енциклопедій Kiwix:
# якщо є — каталог перепідписується з ними (карти й модель не чіпаються,
# лишаються з попереднього каталогу); якщо немає — нічого не збирається.

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Області через кому (kyiv,lvivska…), all або none (без карт)"
        default: "all"
      model_repo:
        description: "Репозиторій GGUF на Hugging Face (порожньо — без моделі)"
        default: "unsloth/gemma-4-E2B-it-GGUF"
      model_file:
        description: "Файл моделі в репозиторії"
        default: "gemma-4-E2B-it-Q4_K_M.gguf"
      model_id:
        description: "id моделі з core/.../models.rs"
        default: "gemma-4-e2b-it-q4"
      zims:
        description: "Додати енциклопедії Kiwix (tools/packs/kiwix.json)"
        type: boolean
        default: true
      filter_infra:
        description: "Прибрати об'єкти зі списку tools/maps/exclude-tags.txt (за замовчуванням карти повні)"
        type: boolean
        default: false
      publish:
        description: "Опублікувати у випуск packs"
        type: boolean
        default: true
  schedule:
    - cron: "23 5 * * 1"
  pull_request:
    paths:
      - "tools/maps/**"
      - "tools/packs/**"
      - ".github/workflows/packs.yml"

permissions:
  contents: write

concurrency:
  group: packs-${{ github.ref }}
  cancel-in-progress: false

# За розкладом: без карт (none), без моделі (порожньо), з публікацією.
env:
  REGIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.regions || github.event_name == 'schedule' && 'none' || 'kyiv' }}
  MODEL_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.model_repo || github.event_name == 'pull_request' && 'unsloth/gemma-4-E2B-it-GGUF' || '' }}
  MODEL_FILE: ${{ github.event_name == 'workflow_dispatch' && inputs.model_file || 'gemma-4-E2B-it-Q4_K_M.gguf' }}
  MODEL_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.model_id || 'gemma-4-e2b-it-q4' }}
  PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || github.event_name == 'schedule' }}
  ZIMS: ${{ github.event_name != 'workflow_dispatch' || inputs.zims }}
  FILTER_INFRA: ${{ github.event_name == 'workflow_dispatch' && inputs.filter_infra && '1' || '0' }}
  TAG: packs

jobs:
  # Лише за розкладом: чи вийшли нові ZIM. Займає секунди; без змін
  # важка збірка нижче не запускається.
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Нові версії енциклопедій Kiwix
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/packs/kiwix_pack.py tools/packs/kiwix.json > zims.json
          gh release download "$TAG" -p catalog.json -O previous.json 2>/dev/null || true
          python3 tools/packs/zim_changes.py zims.json previous.json | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    if: ${{ !cancelled() && (needs.check.result == 'skipped' || needs.check.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Звільнити місце на диску
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Хаб (інструмент пакетів)
        run: cargo build --release -p uautonomy-hub --manifest-path core/Cargo.toml && mkdir -p out work
      - name: Інструменти
        run: sudo apt-get update && sudo apt-get install -y osmium-tool && docker pull ghcr.io/systemed/tilemaker:master
      - name: OSM України (Geofabrik або області з openstreetmap.fr)
        id: osm
        if: env.REGIONS != 'none'
        # На PR недоступність джерела OSM не валить перевірку решти пакетів.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        # Geofabrik, а якщо він не пускає раннер — області з openstreetmap.fr,
        # злиті в один файл (цілого файлу України на дзеркалі немає).
        # На PR одразу резервний шлях, щоб він не зламався непомітно.
        env:
          OSM_MIRROR_ONLY: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: |
          tools/maps/fetch_ukraine.sh work/ukraine.osm.pbf
          ls -la work
      - name: Карти областей
        if: env.REGIONS != 'none' && steps.osm.outcome == 'success'
        env:
          WORK: ${{ github.workspace }}/work/tmp
        run: |
          core/target/release/uautonomy-hub regions > work/regions.json
          tools/maps/build_maps.sh work/ukraine.osm.pbf core/target/release/uautonomy-hub work/regions.json "$REGIONS" out/packs
      - name: Пакет моделі (посилання на Hugging Face)
        if: env.MODEL_REPO != ''
        run: |
          python3 tools/packs/hf_model_pack.py "$MODEL_REPO" "$MODEL_FILE" "$MODEL_ID" "Gemma 4 E2B (телефон)" > out/model.json
          cat out/model.json
      - name: Енциклопедії Kiwix (посилання на download.kiwix.org)
        if: env.ZIMS == 'true'
        run: |
          python3 tools/packs/kiwix_pack.py tools/packs/kiwix.json > out/zims.json
      - name: Перевірка справжніх ZIM нашим читачем
        if: env.ZIMS == 'true'
        run: |
          set -euo pipefail
          mkdir -p work/zim
          # Невеликі файли качаємо повністю, звіряємо SHA-256 і відкриваємо.
          python3 -c "import json;[print(p['files'][0]['url'], p['files'][0]['sha256']) for p in json.load(open('out/zims.json')) if p['files'][0]['size'] < 700_000_000]" |
          while read -r url sha; do
            f="work/zim/$(basename "$url")"
            curl -fL --retry 8 --retry-delay 10 --retry-all-errors -o "$f" "$url"
            echo "$sha  $f" | sha256sum -c -
            core/target/release/uautonomy-hub zim-check "$f" вода кровотеча water bleeding wound
            rm -f "$f"
          done
      - name: Каталог
        run: |
          set -euo pipefail
          mkdir -p out/packs
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          merge=()
          [ -f out/model.json ] && merge+=(--merge out/model.json)
          [ -f out/zims.json ] && merge+=(--merge out/zims.json)
          # Попередній каталог: області, які зараз не перезбирали, лишаються.
          if gh release download "$TAG" -p catalog.json -O out/previous.json 2>/dev/null; then
            merge+=(--merge out/previous.json)
          fi
          # Кожен пакет і сам каталог підписуються ключем проєкту з секрету
          # PACK_SIGNING_KEY (docs/signing.md). Без підпису застосунок пакети
          # не встановить, тож публікація без ключа заборонена.
          sign=()
          if [ -n "${PACK_SIGNING_KEY:-}" ]; then
            sign=(--sign-key-env PACK_SIGNING_KEY)
          elif [ "$PUBLISH" = "true" ]; then
            echo "::error::Секрет PACK_SIGNING_KEY не задано: публікувати непідписані пакети не можна"; exit 1
          else
            echo "::warning::PACK_SIGNING_KEY не задано: каталог без підпису (лише перевірка)"
          fi
          core/target/release/uautonomy-hub catalog out/packs --release-url "$BASE" --stage out/stage "${merge[@]}" "${sign[@]}"
          cp out/packs/catalog.json out/stage/catalog.json
          if [ -f out/packs/catalog.json.sig ]; then
            cp out/packs/catalog.json.sig out/stage/catalog.json.sig
            UAUTONOMY_TRUSTED_KEYS="" core/target/release/uautonomy-hub verify out/stage/catalog.json
          fi
          ls -la out/stage
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_SIGNING_KEY: ${{ secrets.PACK_SIGNING_KEY }}
      - name: Опублікувати у випуск packs
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease \
            --title "Пакети Автономії" \
            --notes "Офлайн-пакети для застосунку «Автономія»: карти областей (OpenStreetMap, ODbL), посилання на енциклопедії Kiwix і модель ШІ. Каталог: catalog.json."
          gh release upload "$TAG" out/stage/* --clobber
      - name: Артефакт (перевірка без публікації)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: packs-preview
          path: out/stage/
          retention-days: 7
