[workspace]
resolver = "2"
members = ["crates/uautonomy-core", "crates/uautonomy-hub"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/louraider/UAutonomy"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
ruzstd = "0.8"
lzma-rs = "0.3"
tar = { version = "0.4", default-features = false }
tiny_http = "0.12"
ureq = { version = "3", default-features = false, features = ["rustls"] }
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
if-addrs = "0.13"
tempfile = "3"
