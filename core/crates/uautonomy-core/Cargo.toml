[package]
name = "uautonomy-core"
description = "Ядро офлайн-бібліотеки «Автономія»: пакети контенту, пошук, (згодом) ZIM, карти та локальний ШІ."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
ruzstd.workspace = true
lzma-rs.workspace = true
tar.workspace = true
tiny_http.workspace = true
ureq.workspace = true
if-addrs.workspace = true
flate2.workspace = true
ed25519-dalek.workspace = true

# sysinfo 0.37 не збирається під iOS (proc_pidinfo є лише в macOS), тож там
# пам'ять і місце читаємо напряму через libc (див. hardware.rs).
[target.'cfg(not(target_os = "ios"))'.dependencies]
sysinfo.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
